name: Update Radar Data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trend-radar/scripts/update_quotes.py'
      - 'trend-radar/scripts/update_investor_sentiment.py'
      - 'trend-radar/scripts/update_public_attention.py'
      - 'trend-radar/scripts/build_sentiment.py'
      - '.github/workflows/update-trend-radar.yml'
  schedule:
    # GitHub cron uses UTC.
    # Every 15 min covers A/H and US weekday sessions.
    # The quote script is lightweight; the app reads the newest snapshot.
    - cron: '*/15 * * * 1-5'
concurrency:
  group: trend-radar-data-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --check trend-radar/app.js
      - run: python -m py_compile trend-radar/scripts/update_quotes.py trend-radar/scripts/update_investor_sentiment.py trend-radar/scripts/update_public_attention.py trend-radar/scripts/build_sentiment.py
      - run: python trend-radar/scripts/update_quotes.py
      - run: python trend-radar/scripts/update_investor_sentiment.py || echo "::warning::Xueqiu sentiment unavailable; keeping prior snapshot"
      - run: python trend-radar/scripts/update_public_attention.py || echo "::warning::Public attention unavailable; keeping prior snapshot"
      - run: python trend-radar/scripts/build_sentiment.py || echo "::warning::Sentiment build unavailable; keeping prior snapshot"
      - run: |
          git config user.name "radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trend-radar/data/quotes.json trend-radar/data/dynamic_pool.json trend-radar/data/investor_sentiment.json trend-radar/data/investor_sentiment_history.json trend-radar/data/douyin_raw.json trend-radar/data/douyin_sentiment.json trend-radar/data/douyin_history.json
          git diff --cached --quiet || git commit -m "Update radar market data"
          git pull --rebase origin main
          git push

# radar pipeline v13 15-minute refresh
