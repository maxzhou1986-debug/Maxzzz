name: Update Radar Data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trend-radar/scripts/update_quotes.py'
      - '.github/workflows/update-trend-radar.yml'
  schedule:
    - cron: "20 8,10,12,14,16,20 * * 1-5"
concurrency:
  group: trend-radar-data-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python trend-radar/scripts/update_quotes.py
      - run: python trend-radar/scripts/update_investor_sentiment.py || true
      - run: python trend-radar/scripts/update_public_attention.py || true
      - run: python trend-radar/scripts/normalize_douyin_search.py || true
      - run: python trend-radar/scripts/build_sentiment.py || true
      - run: |
          git config user.name "radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trend-radar/data/quotes.json trend-radar/data/investor_sentiment.json trend-radar/data/investor_sentiment_history.json trend-radar/data/douyin_raw.json trend-radar/data/douyin_sentiment.json trend-radar/data/douyin_history.json
          git diff --cached --quiet || git commit -m "Update radar market data"
          git pull --rebase origin main
          git push
