name: Update Radar Data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trend-radar/scripts/update_quotes.py'
      - '.github/workflows/update-trend-radar.yml'
  schedule:
    - cron: "20 8,10,12,14,16,20 * * 1-5"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python trend-radar/scripts/update_quotes.py
      - run: |
          git config user.name "radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trend-radar/data/quotes.json
          git diff --cached --quiet || git commit -m "Update radar market data"
          git push
