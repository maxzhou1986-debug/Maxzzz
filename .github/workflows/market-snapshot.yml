name: Market Review Snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - 'fund-radar/tools/build_review_snapshot.py'
      - 'fund-radar/tools/build_signals.py'
      - '.github/workflows/market-snapshot.yml'
  schedule:
    - cron: '*/5 1-8 * * 1-5'  # 09:00-16:55 Beijing/Taipei, practical GitHub timing may lag a few minutes

permissions:
  contents: write

concurrency:
  group: market-review-snapshot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check market window
        id: market
        shell: bash
        run: |
          HHMM=$(TZ=Asia/Shanghai date +%H%M)
          WD=$(TZ=Asia/Shanghai date +%u)
          echo "hhmm=$HHMM" >> "$GITHUB_OUTPUT"
          if [ "$WD" -le 5 ] && [ "$HHMM" -ge 0915 ] && [ "$HHMM" -le 1635 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build A/H market snapshots
        if: steps.market.outputs.run == 'true' || github.event_name != 'schedule'
        run: |
          python3 fund-radar/tools/build_review_snapshot.py
          python3 fund-radar/tools/build_signals.py
      - name: Commit updated snapshots
        if: steps.market.outputs.run == 'true' || github.event_name != 'schedule'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p fund-radar/data
          git add -A fund-radar/data
          git diff --cached --quiet && exit 0
          git commit -m "Update market snapshots $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main || true
          git push
