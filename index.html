<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0f12"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="中国电台">
<link rel="manifest" href="manifest.webmanifest"><title>中国电台</title>
<style>
:root{--bg:#0e0f12;--card:#191b21;--line:#2b2e37;--muted:#9ba0aa;--safe:env(safe-area-inset-bottom)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body{padding-bottom:142px}button,input{font:inherit}header{position:sticky;top:0;z-index:5;padding:calc(15px + env(safe-area-inset-top)) 18px 10px;background:rgba(14,15,18,.95);backdrop-filter:blur(18px)}.top{display:flex;justify-content:space-between;align-items:end}.title{font-size:30px;font-weight:850}.live{font-size:12px;color:#ff7166}.search{margin-top:13px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px}.search input{width:100%;border:0;outline:0;background:none;color:#fff;font-size:16px}.chips{display:flex;gap:8px;overflow:auto;padding:12px 18px 3px;scrollbar-width:none}.chip{border:1px solid var(--line);background:var(--card);color:#ddd;padding:8px 13px;border-radius:99px;white-space:nowrap}.chip.active{background:#fff;color:#111;font-weight:750}.hero{margin:14px 18px 18px;padding:22px;border-radius:24px;min-height:175px;background:radial-gradient(circle at 88% 5%,#8a2d25,#352023 32%,#1a1b21 72%);display:flex;flex-direction:column;justify-content:space-between}.hero small{color:#ffaaa2;font-weight:700}.hero h2{margin:7px 0 4px;font-size:27px}.hero p{margin:0;color:#b4b8c1}.heroRow{display:flex;gap:9px;margin-top:16px}.hero button,.soft{border:0;border-radius:99px;padding:10px 15px;font-weight:800}.soft{background:#2a2d35;color:#fff;border:1px solid #3a3d46}.section{padding:0 18px}.section h3{font-size:20px;margin:18px 0 10px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick button{background:var(--card);border:1px solid var(--line);border-radius:16px;color:#fff;padding:12px 8px}.quick b{display:block;font-size:18px;margin-bottom:3px}.quick span{font-size:12px;color:var(--muted)}.grid{display:grid;gap:10px}.station{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px}.logo{width:52px;height:52px;border-radius:15px;background:#272a32;display:grid;place-items:center;font-weight:900;flex:none}.meta{flex:1;min-width:0}.name{font-weight:800}.desc{font-size:13px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.round{width:39px;height:39px;border-radius:50%;border:1px solid #373a43;background:#252831;color:#fff;font-size:17px;flex:none}.fav{color:#ff776e}.empty{text-align:center;color:#777;padding:35px}.note{padding:16px 18px;color:#747985;font-size:12px;line-height:1.5}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#2a2d35;color:#aaa;font-size:11px;margin-left:5px}.player{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--safe));z-index:20;background:rgba(29,31,37,.97);border:1px solid #3b3e47;border-radius:22px;padding:10px 12px;display:none;align-items:center;gap:10px;backdrop-filter:blur(22px);box-shadow:0 16px 50px rgba(0,0,0,.45)}.player.show{display:flex}.pmeta{flex:1;min-width:0}.pname{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pstatus{font-size:12px;color:#aeb2bb;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pbtn{width:46px;height:46px;border:0;border-radius:50%;font-size:19px;font-weight:850}.tiny{width:38px;height:38px;border-radius:50%;border:1px solid #3b3e47;background:#242730;color:#fff}.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none;align-items:end}.sheet.show{display:flex}.panel{width:100%;background:#191b21;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + var(--safe));border-top:1px solid #343740}.panel h3{margin:0 0 14px;font-size:22px}.sleepGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.sleepGrid button{padding:14px;border-radius:16px;border:1px solid #373a43;background:#242730;color:#fff;font-weight:700}.cancel{margin-top:12px;width:100%;padding:13px;border-radius:16px;border:0;background:#fff;color:#111;font-weight:800}
</style></head><body>
<header><div class="top"><div class="title">中国电台</div><div class="live">● LIVE</div></div><div class="search"><input id="search" placeholder="搜索电台、音乐、城市…"></div></header>
<div class="chips" id="chips"></div>
<div class="hero"><div><small>稳定线路优先</small><h2>中国之声</h2><p>国家新闻广播 · HTTPS 直连</p></div><div class="heroRow"><button id="heroPlay">▶ 立即收听</button><button class="soft" id="heroFav">♡ 收藏</button></div></div>
<div class="section"><div class="quick"><button id="recentBtn"><b>↶</b><span>最近收听</span></button><button id="sleepBtn"><b>☾</b><span id="sleepLabel">睡眠定时</span></button><button id="retryBtn"><b>↻</b><span>重连线路</span></button></div></div>
<div class="section"><h3 id="sectionTitle">可用电台</h3><div class="grid" id="list"></div></div>
<div class="note">V6：已移除大量不稳定或仅 HTTP 的直播源，只保留当前能查到的 HTTPS 工作线路。先保证“点一个响一个”，后续再逐个补回央广其他频道。</div>
<audio id="audio" playsinline preload="none"></audio>
<div class="player" id="player"><div class="logo" id="pLogo">央</div><div class="pmeta"><div class="pname" id="pName"></div><div class="pstatus" id="pStatus">准备播放</div></div><button class="tiny" id="sleepMini">☾</button><button class="pbtn" id="toggle">▶</button></div>
<div class="sheet" id="sleepSheet"><div class="panel"><h3>睡眠定时</h3><div class="sleepGrid"><button data-min="15">15 分钟</button><button data-min="30">30 分钟</button><button data-min="45">45 分钟</button><button data-min="60">60 分钟</button><button data-min="90">90 分钟</button><button data-min="0">关闭定时</button></div><button class="cancel" id="closeSheet">完成</button></div></div>
<script>
const stations=[
{id:'cnr1',name:'中国之声',tag:'央广',cat:'新闻',desc:'国家新闻广播',logo:'央',urls:['https://lhttp.qtfm.cn/live/15318317/64k.mp3']},
{id:'cnr3',name:'音乐之声',tag:'央广',cat:'音乐',desc:'MusicRadio 华语流行',logo:'音',urls:['https://ngcdn001.cnr.cn/live/yyzs/index.m3u8']},
{id:'bjnews',name:'北京新闻广播',tag:'北京',cat:'新闻',desc:'北京新闻资讯',logo:'京',urls:['https://lhttp.qtfm.cn/live/339/64k.mp3']},
{id:'bjmusic',name:'北京音乐广播',tag:'北京',cat:'音乐',desc:'FM97.4',logo:'音',urls:['https://lhttp.qtfm.cn/live/332/64k.mp3']},
{id:'bjwenyi',name:'北京文艺广播',tag:'北京',cat:'文艺',desc:'FM87.6',logo:'文',urls:['https://lhttp.qtfm.cn/live/333/64k.mp3']},
{id:'gdnews',name:'广东新闻广播',tag:'广东',cat:'新闻',desc:'广东新闻资讯',logo:'粤',urls:['https://lhttp.qtfm.cn/live/1254/64k.mp3']},
{id:'gdmusic',name:'广东音乐之声',tag:'广东',cat:'音乐',desc:'FM99.3',logo:'音',urls:['https://lhttp.qtfm.cn/live/1260/64k.mp3']},
{id:'gdzj',name:'珠江经济台',tag:'广东',cat:'财经',desc:'广东珠江经济台',logo:'财',urls:['https://lhttp.qtfm.cn/live/1259/64k.mp3']},
{id:'gdstock',name:'广东股市广播',tag:'广东',cat:'财经',desc:'财经与股市资讯',logo:'股',urls:['https://lhttp.qtfm.cn/live/4847/64k.mp3']},
{id:'jsmusic',name:'江苏经典流行音乐广播',tag:'江苏',cat:'音乐',desc:'经典与流行音乐',logo:'苏',urls:['https://lhttp.qtfm.cn/live/4938/64k.mp3']},
{id:'shclassic',name:'上海经典音乐广播',tag:'上海',cat:'音乐',desc:'FM94.7',logo:'沪',urls:['https://lhttp-hw.qtfm.cn/live/267/64k.mp3']},
{id:'cri905',name:'环球资讯广播',tag:'国际台',cat:'新闻',desc:'CMG 环球资讯',logo:'环',urls:['https://sk.cri.cn/905.m3u8']},
{id:'cgtn',name:'CGTN Radio',tag:'国际台',cat:'新闻',desc:'英语新闻与资讯',logo:'C',urls:['https://sk.cri.cn/am846.m3u8']}
];
const $=id=>document.getElementById(id),audio=$('audio'),list=$('list'),chips=$('chips'),search=$('search'),player=$('player'),pName=$('pName'),pStatus=$('pStatus'),pLogo=$('pLogo'),toggle=$('toggle'),sectionTitle=$('sectionTitle');
let activeCat='全部',current=null,urlIndex=0,attempt=0,sleepTimer=null;let favs=new Set(JSON.parse(localStorage.getItem('radio-favs')||'[]'));let recent=JSON.parse(localStorage.getItem('radio-recent')||'[]');const cats=['全部','新闻','音乐','财经','文艺','收藏'];
function renderChips(){chips.innerHTML=cats.map(c=>`<button class="chip ${activeCat===c?'active':''}" data-cat="${c}">${c}</button>`).join('');chips.querySelectorAll('button').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;renderChips();render()})}
function filtered(){let q=search.value.trim().toLowerCase();return stations.filter(s=>(activeCat==='全部'||s.cat===activeCat||(activeCat==='收藏'&&favs.has(s.id)))&&(!q||(`${s.name} ${s.desc} ${s.tag}`).toLowerCase().includes(q)))}
function render(arr=filtered()){sectionTitle.textContent=activeCat==='全部'?'可用电台':activeCat;list.innerHTML=arr.length?arr.map(s=>`<div class="station"><div class="logo">${s.logo}</div><div class="meta"><div class="name">${s.name}${current&&current.id===s.id?'<span class="badge">播放中</span>':''}</div><div class="desc">${s.desc} · ${s.tag}</div></div><button class="round fav" data-fav="${s.id}">${favs.has(s.id)?'♥':'♡'}</button><button class="round" data-play="${s.id}">▶</button></div>`).join(''):'<div class="empty">没有找到电台</div>';wireRows()}
function wireRows(){list.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>playStation(stations.find(s=>s.id===b.dataset.play)));list.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{let id=b.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem('radio-favs',JSON.stringify([...favs]));render();syncHeroFav()})}
function addRecent(id){recent=[id,...recent.filter(x=>x!==id)].slice(0,8);localStorage.setItem('radio-recent',JSON.stringify(recent))}
function playStation(s){if(!s)return;current=s;addRecent(s.id);urlIndex=0;attempt++;player.classList.add('show');pName.textContent=s.name;pLogo.textContent=s.logo;pStatus.textContent='正在连接直播…';toggle.textContent='❚❚';render();tryUrl(attempt)}
function tryUrl(token){if(!current||token!==attempt)return;if(urlIndex>=current.urls.length){pStatus.textContent='当前线路暂时不可用';toggle.textContent='▶';return}const u=current.urls[urlIndex];let advanced=false;audio.pause();audio.removeAttribute('src');audio.load();audio.src=u;const timer=setTimeout(next,12000);function next(){if(advanced||token!==attempt)return;advanced=true;clearTimeout(timer);urlIndex++;tryUrl(token)}audio.onerror=next;audio.onplaying=()=>{if(token!==attempt)return;advanced=true;clearTimeout(timer);pStatus.textContent=`正在直播 · 线路 ${urlIndex+1}`;toggle.textContent='❚❚';if('mediaSession'in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:current.name,artist:current.desc,album:'中国电台 · LIVE'})};const p=audio.play();if(p&&p.catch)p.catch(next)}
toggle.onclick=()=>{if(!current)return;if(audio.paused){audio.play().then(()=>{toggle.textContent='❚❚';pStatus.textContent=`正在直播 · 线路 ${urlIndex+1}`}).catch(()=>pStatus.textContent='播放失败，请重新选择电台')}else{audio.pause();toggle.textContent='▶';pStatus.textContent='已暂停'}};
function syncHeroFav(){$('heroFav').textContent=favs.has('cnr1')?'♥ 已收藏':'♡ 收藏'}
$('heroFav').onclick=()=>{favs.has('cnr1')?favs.delete('cnr1'):favs.add('cnr1');localStorage.setItem('radio-favs',JSON.stringify([...favs]));syncHeroFav();render()};$('heroPlay').onclick=()=>playStation(stations[0]);$('retryBtn').onclick=()=>{if(current)playStation(current)};$('recentBtn').onclick=()=>{activeCat='全部';renderChips();const arr=recent.map(id=>stations.find(s=>s.id===id)).filter(Boolean);sectionTitle.textContent='最近收听';render(arr)};
function openSleep(){$('sleepSheet').classList.add('show')}function closeSleep(){$('sleepSheet').classList.remove('show')}$('sleepBtn').onclick=openSleep;$('sleepMini').onclick=openSleep;$('closeSheet').onclick=closeSleep;$('sleepSheet').onclick=e=>{if(e.target===$('sleepSheet'))closeSleep()};document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{clearTimeout(sleepTimer);const m=+b.dataset.min;if(m>0){$('sleepLabel').textContent=`${m} 分钟后暂停`;sleepTimer=setTimeout(()=>{audio.pause();toggle.textContent='▶';pStatus.textContent='睡眠定时已暂停';$('sleepLabel').textContent='睡眠定时'},m*60000)}else $('sleepLabel').textContent='睡眠定时';closeSleep()});
search.oninput=()=>render();if('mediaSession'in navigator){navigator.mediaSession.setActionHandler('play',()=>audio.play());navigator.mediaSession.setActionHandler('pause',()=>audio.pause())}if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));syncHeroFav();renderChips();render();
</script></body></html>
