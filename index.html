<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="中国电台">
<link rel="manifest" href="manifest.webmanifest">
<title>中国电台 V9</title>
<style>
:root{--bg:#0e0f12;--card:#191b21;--line:#2b2e37;--muted:#9ba0aa;--safe:env(safe-area-inset-bottom)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding-bottom:120px}header{position:sticky;top:0;z-index:5;padding:calc(16px + env(safe-area-inset-top)) 18px 12px;background:rgba(14,15,18,.95);backdrop-filter:blur(18px)}.top{display:flex;justify-content:space-between;align-items:end}.title{font-size:30px;font-weight:850}.live{font-size:12px;color:#ff7166}.search{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px}.search input{width:100%;border:0;outline:0;background:none;color:#fff;font-size:16px}.chips{display:flex;gap:8px;overflow:auto;padding:12px 18px 4px}.chip{border:1px solid var(--line);background:var(--card);color:#ddd;padding:8px 13px;border-radius:99px;white-space:nowrap}.chip.active{background:#fff;color:#111;font-weight:750}.hero{margin:14px 18px;padding:22px;border-radius:24px;background:radial-gradient(circle at 88% 5%,#8a2d25,#352023 32%,#1a1b21 72%)}.hero small{color:#ffaaa2;font-weight:700}.hero h2{font-size:27px;margin:7px 0 4px}.hero p{color:#b4b8c1;margin:0}.hero button{margin-top:16px;border:0;border-radius:99px;padding:11px 17px;font-weight:800}.section{padding:0 18px}.section h3{font-size:20px;margin:18px 0 10px}.grid{display:grid;gap:10px}.station{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px}.logo{width:50px;height:50px;border-radius:15px;background:#272a32;display:grid;place-items:center;font-weight:900;flex:none}.meta{flex:1;min-width:0}.name{font-weight:800}.desc{font-size:13px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.round{width:40px;height:40px;border-radius:50%;border:1px solid #373a43;background:#252831;color:#fff;font-size:17px}.fav{color:#ff776e}.badge{font-size:10px;padding:3px 6px;border-radius:99px;background:#173624;color:#8ff0ac;margin-left:6px}.note{padding:16px 18px;color:#747985;font-size:12px;line-height:1.55}.player{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--safe));z-index:20;background:rgba(29,31,37,.97);border:1px solid #3b3e47;border-radius:22px;padding:10px 12px;display:none;align-items:center;gap:10px;backdrop-filter:blur(22px)}.player.show{display:flex}.pmeta{flex:1;min-width:0}.pname{font-weight:800}.pstatus{font-size:12px;color:#aeb2bb;margin-top:3px}.pbtn{width:46px;height:46px;border:0;border-radius:50%;font-size:18px}.empty{text-align:center;color:#777;padding:30px}
</style>
</head>
<body>
<header><div class="top"><div class="title">中国电台</div><div class="live">● LIVE · V9</div></div><div class="search"><input id="search" placeholder="搜索央广、新闻、音乐…"></div></header>
<div class="chips" id="chips"></div>
<div class="hero"><small>中央广播电视总台 · 央广</small><h2>中国之声</h2><p>V9：只把独立检测为可用的 HTTPS 线路放进正式播放列表</p><button id="heroPlay">▶ 立即收听</button></div>
<div class="section"><h3 id="sectionTitle">央广电台</h3><div class="grid" id="list"></div></div>
<div class="note">V9 不再使用未经当前检测的央广线路。经济之声等目前只有 HTTP 被检测为可用的频道先不强行加入，避免在 iPhone 的 HTTPS 页面里再次加载失败。</div>
<audio id="audio" playsinline preload="none"></audio>
<div class="player" id="player"><div class="logo" id="pLogo">央</div><div class="pmeta"><div class="pname" id="pName"></div><div class="pstatus" id="pStatus">准备播放</div></div><button class="pbtn" id="toggle">▶</button></div>
<script>
const stations=[
{id:'cnr1',name:'中国之声',tag:'央广',cat:'央广',desc:'国家新闻广播',logo:'央',verified:true,urls:['https://lhttp.qtfm.cn/live/15318317/64k.mp3']},
{id:'cnr3',name:'音乐之声',tag:'央广',cat:'央广',desc:'MusicRadio 华语流行',logo:'音',verified:true,urls:['https://ngcdn001.cnr.cn/live/yyzs/index.m3u8']},
{id:'bjnews',name:'北京新闻广播',tag:'北京',cat:'地方',desc:'北京新闻资讯',logo:'京',urls:['https://lhttp.qtfm.cn/live/339/64k.mp3']},
{id:'bjmusic',name:'北京音乐广播',tag:'北京',cat:'地方',desc:'FM97.4',logo:'音',urls:['https://lhttp.qtfm.cn/live/332/64k.mp3']},
{id:'gdnews',name:'广东新闻广播',tag:'广东',cat:'地方',desc:'广东新闻资讯',logo:'粤',urls:['https://lhttp.qtfm.cn/live/1254/64k.mp3']},
{id:'gdmusic',name:'广东音乐之声',tag:'广东',cat:'地方',desc:'FM99.3',logo:'音',urls:['https://lhttp.qtfm.cn/live/1260/64k.mp3']},
{id:'gdzj',name:'珠江经济台',tag:'广东',cat:'地方',desc:'财经生活资讯',logo:'财',urls:['https://lhttp.qtfm.cn/live/1259/64k.mp3']},
{id:'jsmusic',name:'江苏经典流行音乐广播',tag:'江苏',cat:'地方',desc:'经典与流行音乐',logo:'苏',urls:['https://lhttp.qtfm.cn/live/4938/64k.mp3']},
{id:'shclassic',name:'上海经典音乐广播',tag:'上海',cat:'地方',desc:'FM94.7',logo:'沪',urls:['https://lhttp-hw.qtfm.cn/live/267/64k.mp3']},
{id:'cri905',name:'环球资讯广播',tag:'国际台',cat:'地方',desc:'CMG 环球资讯',logo:'环',urls:['https://sk.cri.cn/905.m3u8']}
];
const $=x=>document.getElementById(x),audio=$('audio'),list=$('list'),chips=$('chips'),search=$('search'),player=$('player'),pName=$('pName'),pStatus=$('pStatus'),pLogo=$('pLogo'),toggle=$('toggle');
let cat='央广',current=null,urlIndex=0,token=0;let favs=new Set(JSON.parse(localStorage.getItem('radio-favs')||'[]'));const cats=['央广','地方','收藏','全部'];
function renderChips(){chips.innerHTML=cats.map(x=>`<button class="chip ${cat===x?'active':''}" data-c="${x}">${x}</button>`).join('');chips.querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;renderChips();render()})}
function filtered(){let q=search.value.trim();return stations.filter(s=>(cat==='全部'||s.cat===cat||(cat==='收藏'&&favs.has(s.id)))&&(!q||(s.name+s.desc+s.tag).includes(q)))}
function render(){let a=filtered();$('sectionTitle').textContent=cat==='央广'?'央广电台':cat;list.innerHTML=a.length?a.map(s=>`<div class="station"><div class="logo">${s.logo}</div><div class="meta"><div class="name">${s.name}${s.verified?'<span class="badge">已验证</span>':''}</div><div class="desc">${s.desc} · ${s.tag}</div></div><button class="round fav" data-f="${s.id}">${favs.has(s.id)?'♥':'♡'}</button><button class="round" data-p="${s.id}">▶</button></div>`).join(''):'<div class="empty">没有找到电台</div>';list.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>play(stations.find(s=>s.id===b.dataset.p)));list.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{let id=b.dataset.f;favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem('radio-favs',JSON.stringify([...favs]));render()})}
function play(s){current=s;urlIndex=0;token++;player.classList.add('show');pName.textContent=s.name;pLogo.textContent=s.logo;tryUrl(token)}
function tryUrl(t){if(t!==token||!current)return;if(urlIndex>=current.urls.length){pStatus.textContent='线路暂不可用';toggle.textContent='▶';return}let i=urlIndex,u=current.urls[i],done=false;pStatus.textContent=`连接线路 ${i+1}/${current.urls.length}…`;audio.pause();audio.removeAttribute('src');audio.load();audio.src=u;let timer=setTimeout(next,12000);function next(){if(done||t!==token)return;done=true;clearTimeout(timer);urlIndex++;tryUrl(t)}audio.onerror=next;audio.onplaying=()=>{if(t!==token)return;done=true;clearTimeout(timer);pStatus.textContent=`正在直播 · 线路 ${i+1}/${current.urls.length}`;toggle.textContent='❚❚';if('mediaSession'in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:current.name,artist:current.desc,album:'中国电台 · LIVE'})};let p=audio.play();if(p?.catch)p.catch(next)}
toggle.onclick=()=>{if(!current)return;if(audio.paused)audio.play().then(()=>toggle.textContent='❚❚').catch(()=>{urlIndex++;tryUrl(token)});else{audio.pause();toggle.textContent='▶';pStatus.textContent='已暂停'}};
$('heroPlay').onclick=()=>play(stations[0]);search.oninput=render;renderChips();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
